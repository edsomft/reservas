<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Reservas</title>
  </head>
  <body>
    <main class="container">
      <h1>Sistema de Reservas</h1>

      <h2 id="form-title">Nova reserva</h2>

      <form id="reservation-form">
        <label>Nome do cliente
          <input type="text" name="customerName" required />
        </label>

        <label>Recurso
          <select name="resource" required>
            <option value="sala">Sala</option>
            <option value="quadra">Quadra</option>
            <option value="laboratorio">Laboratório</option>
          </select>
        </label>

        <label>Data
          <input type="date" name="date" required />
        </label>

        <label>Início
          <input type="time" name="startTime" required />
        </label>

        <label>Fim
          <input type="time" name="endTime" required />
        </label>

        <label>Observações (opcional)
          <input type="text" name="notes" />
        </label>

        <button type="submit" class="btn">Reservar</button>

        <button type="button" id="cancel-edit" class="btn btn-secondary" hidden>Cancelar edição</button>
      </form>

      <p id="message" role="alert"></p>

            <h2>Horários disponíveis</h2>

      <form id="availability-form" class="filters">
        <label>Recurso
          <select id="availability-resource">
            <option value="sala">Sala</option>
            <option value="quadra">Quadra</option>
            <option value="laboratorio">Laboratório</option>
          </select>
        </label>

        <label>Data
          <input type="date" id="availability-date" required />
        </label>

        <button type="submit" class="btn">Consultar</button>
      </form>

      <p id="availability-hint" class="count"></p>
      <ul id="availability-list"></ul>

      <h2>Reservas</h2>

      <form id="filter-form" class="filters">
        <label>Buscar por nome
          <input type="search" id="filter-search" placeholder="Ex.: Maria" />
        </label>

        <label>Recurso
          <select id="filter-resource">
            <option value="todos">Todos</option>
            <option value="sala">Sala</option>
            <option value="quadra">Quadra</option>
            <option value="laboratorio">Laboratório</option>
          </select>
        </label>

        <label>Status
          <select id="filter-status">
            <option value="todos">Todos</option>
            <option value="ativa">Ativa</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </label>

        <label>Data
          <input type="date" id="filter-date" />
        </label>

        <button type="button" id="clear-filters" class="btn btn-secondary">Limpar filtros</button>
      </form>

      <p id="result-count" class="count"></p>
          <div id="selection-panel" class="panel" hidden>
            <p id="selection-info"></p>

            <div class="panel-actions">
              <button type="button" id="edit-selected" class="btn">Editar</button>
              <button type="button" id="reschedule-selected" class="btn">Reagendar</button>
              <button type="button" id="cancel-selected" class="btn btn-warning">Cancelar reserva</button>
              <button type="button" id="delete-selected" class="btn btn-danger">Excluir</button>
            </div>

            <form id="reschedule-form" class="reschedule" hidden>
              <label>Nova data
                <input type="date" name="date" required />
              </label>

              <label>Novo início
                <input type="time" name="startTime" required />
              </label>

              <label>Novo fim
                <input type="time" name="endTime" required />
              </label>

              <div class="panel-actions">
                <button type="submit" class="btn">Confirmar reagendamento</button>
                <button type="button" id="cancel-reschedule" class="btn btn-secondary">Voltar</button>
              </div>
            </form>
          </div>
      <ul id="reservation-list"></ul>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
