<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Reservas</title>
  </head>
  <body>
    <main class="container">
      <h1>Sistema de Reservas</h1>

      <h2>Nova reserva</h2>

      <form id="reservation-form">
        <label>Nome do cliente
          <input type="text" name="customerName" required />
        </label>

        <label>Local
          <select name="resource" required></select>
        </label>

        <label>Data
          <input type="date" name="date" required />
        </label>

        <label>Início
          <input type="time" name="startTime" required />
        </label>

        <label>Fim
          <input type="time" name="endTime" required />
        </label>

        <label>Observações (opcional)
          <input type="text" name="notes" />
        </label>

        <button type="submit" class="btn">Reservar</button>
      </form>

      <p id="message" role="alert"></p>

      <h2>Horários disponíveis</h2>

      <form id="availability-form" class="filters">
        <label>Local
          <select id="availability-resource"></select>
        </label>

        <label>Data
          <input type="date" id="availability-date" required />
        </label>

        <button type="submit" class="btn">Consultar</button>
      </form>

      <p id="availability-hint" class="count"></p>
      <ul id="availability-list"></ul>

      <h2>Reservas</h2>

      <form id="filter-form" class="filters">
        <label>Buscar por nome
          <input type="search" id="filter-search" placeholder="Ex.: Maria" />
        </label>

        <label>Local
          <select id="filter-resource">
            <option value="todos">Todos</option>
          </select>
        </label>

        <label>Status
          <select id="filter-status">
            <option value="todos">Todos</option>
            <option value="ativa">Ativa</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </label>

        <label>Data
          <input type="date" id="filter-date" />
        </label>

        <button type="button" id="clear-filters" class="btn btn-secondary">Limpar filtros</button>
      </form>

      <p id="result-count" class="count"></p>

      <ul id="reservation-list"></ul>
    </main>

    <!-- Modelo do menu que aparece dentro da reserva selecionada.
         O conteúdo do <template> não é exibido: o main.ts clona uma cópia. -->
    <template id="item-menu-template">
      <div class="item-menu">
        <div class="panel-actions" data-role="actions">
          <button type="button" class="btn" data-action="edit">Editar</button>
          <button type="button" class="btn" data-action="reschedule">Reagendar</button>
          <button type="button" class="btn btn-warning" data-action="cancel">Cancelar reserva</button>
          <button type="button" class="btn btn-danger" data-action="delete">Excluir</button>
        </div>

        <form class="inline-form" data-form="edit" hidden>
          <label>Nome do cliente
            <input type="text" name="customerName" required />
          </label>

          <label>Local
            <select name="resource" required></select>
          </label>

          <label>Data
            <input type="date" name="date" required />
          </label>

          <label>Início
            <input type="time" name="startTime" required />
          </label>

          <label>Fim
            <input type="time" name="endTime" required />
          </label>

          <label>Observações (opcional)
            <input type="text" name="notes" />
          </label>

          <div class="panel-actions">
            <button type="submit" class="btn">Salvar alterações</button>
            <button type="button" class="btn btn-secondary" data-action="back">Voltar</button>
          </div>
        </form>

        <form class="inline-form" data-form="reschedule" hidden>
          <label>Nova data
            <input type="date" name="date" required />
          </label>

          <label>Novo início
            <input type="time" name="startTime" required />
          </label>

          <label>Novo fim
            <input type="time" name="endTime" required />
          </label>

          <div class="panel-actions">
            <button type="submit" class="btn">Confirmar reagendamento</button>
            <button type="button" class="btn btn-secondary" data-action="back">Voltar</button>
          </div>
        </form>
      </div>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
